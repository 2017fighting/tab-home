name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Package extension
        run: zip -r tab-home.zip extension/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: tab-home.zip
          generate_release_notes: true
